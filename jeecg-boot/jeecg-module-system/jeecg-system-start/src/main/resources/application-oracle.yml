server:
  port: 8080
  tomcat:
    max-swallow-size: -1
  servlet:
    context-path: /jeecg-boot
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

management:
  endpoints:
    web:
      exposure:
        include: metrics,httpexchanges,jeecghttptrace

spring:
  flyway:
    # 是否启用flyway
    enabled: false
    # 是否关闭要清除已有库下的表功能,生产环境必须为true,否则会删库，非常重要！！！
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # 定时任务发送邮件
    timeJobSend: false
    host: smtp.163.com
    username: jeecgos@163.com
    password: ??
    properties:
      mail.smtp.timeout: 10000  # 连接超时（毫秒）
      mail.smtp.connectiontimeout: 10000  # 连接超时（毫秒）
      mail.smtp.writetimeout: 10000  # 写入超时（毫秒）
      mail.smtp.auth: true
      smtp.ssl.enable: true
  ## quartz定时任务,采用数据库方式
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: embedded
    #定时任务启动开关，true-开  false-关
    auto-startup: true
    #延迟1秒启动定时任务
    startup-delay: 1s
    #启动时更新己存在的Job
    overwrite-existing-jobs: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: MyScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
            misfireThreshold: 12000
            clusterCheckinInterval: 15000
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true
  #json 时间戳统一转换
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  jpa:
    open-in-view: false
  aop:
    proxy-target-class: true
  #配置freemarker
  freemarker:
    # 设置模板后缀名
    suffix: .ftl
    # 设置文档类型
    content-type: text/html
    # 设置页面编码格式
    charset: UTF-8
    # 设置页面缓存
    cache: false
    prefer-file-system-access: false
    # 设置ftl文件路径
    template-loader-path:
      - classpath:/templates
    template_update_delay: 0
  # 设置静态文件路径，js,css等
  mvc:
    static-path-pattern: /**
    #Spring Boot 2.6+后映射匹配的默认策略已从AntPathMatcher更改为PathPatternParser,需要手动指定为ant-path-matcher
    pathmatch:
      matching-strategy: ant_path_matcher
  resource:
    static-locations: classpath:/static/,classpath:/public/
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        # 默认弱口令，部署前务必修改
        loginPassword: 123456
        allow:
      web-stat-filter:
        enabled: true
    dynamic:
      druid: # 全局druid参数，绝大部分值和默认保持一致。(现已支持的参数如下,不清楚含义不要乱设置)
        # 连接池的配置信息
        # 初始化大小，最小，最大
        initial-size: 5
        min-idle: 5
        maxActive: 20
        # 配置获取连接等待超时的时间
        maxWait: 60000
        # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        timeBetweenEvictionRunsMillis: 60000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        #testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        # 打开PSCache，并且指定每个连接上PSCache的大小
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        filters: stat,wall,slf4j
      datasource:
        master:
          url: jdbc:oracle:thin:@127.0.0.1:1521:helowin
          username: jeecgboot
          password: ???
          driver-class-name: oracle.jdbc.OracleDriver
  #          # 多数据源配置
  #        multi-datasource1:
  #          url: jdbc:sqlserver://192.168.1.199:1433;SelectMethod=cursor;DatabaseName=jeecgbootbpm
  #          username: jeecgboot
  #          password: jeecgboot@459
  #          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  #redis配置
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      password: ''
#mybatis plus 设置
mybatis-plus:
  mapper-locations: classpath*:org/jeecg/**/xml/*Mapper.xml
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      #主键类型  0:"数据库ID自增",1:"该类型为未设置主键类型", 2:"用户输入ID",3:"全局唯一ID (数字类型唯一ID)", 4:"全局唯一ID UUID",5:"字符串全局唯一ID (idWorker 的字符串表示)";
      id-type: ASSIGN_ID
      # 默认数据库表下划线命名
      table-underline: true
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回类型为Map,显示null对应的字段
    call-setters-on-nulls: true
#jeecg专用配置
minidao:
  base-package: org.jeecg.modules.jmreport.*,org.jeecg.modules.drag.*,org.jeecg.modules.chat2bi.*
jeecg:
  # AI集成
  ai-chat:
    enabled: true
    model: deepseek-v4-pro
    apiKey: ??
    apiHost: https://api.deepseek.com/v1
    timeout: 60
    skills-dir:
    skills-shell-dir:
    # AI聊天助手访问限流配置
    rate-limit:
      # 单 session 每分钟上限
      send-per-session-per-minute: 10
      # 单 IP 每分钟上限
      send-per-ip-per-minute: 20
      # 单 session 每小时上限
      upload-per-session-per-hour: 20
    # AI文生图绘画
    ai-model-draw:
      # 提供商 OPENAI/ZHIPU/QWEN
      provider: QWEN
      model: wan2.2-t2i-flash
      apiKey: sk-??
      apiHost: https://dashscope.aliyuncs.com/api/v1/
      timeout: 60
    # AI图生图绘画
    ai-model-pic-draw:
      # 提供商 QWEN
      provider: QWEN
      # 目前只支持 wan2.5-i2i-preview和wanx2.1-imageedit模型
      model: wan2.5-i2i-preview
      apiKey: sk-??
      apiHost: https://dashscope.aliyuncs.com/api/v1/
      timeout: 60
    # AI语音 目前只支持智普 glm-tts
    ai-model-voice:
      provider: ZHIPU
      model: glm-tts
      apiKey: ??
      apiHost: https://open.bigmodel.cn/api/paas/v4
      timeout: 60
      # tongtong、chuichui、xiaochen、jam、kazi、douji、luodo
      voice: tongtong
      speed: 1.0
      volume: 0.0
    # AI视频目前只支持智普 支持模型 cogvideox-3（支持自动生成语音）;viduq1-text、vidu2-reference(不支持自动生成语音，还贵)
    ai-model-video:
      provider: ZHIPU
      model: cogvideox-3
      apiKey: sk-??
      apiHost: https://open.bigmodel.cn/api/paas/v4
      timeout: 60
      ffmpeg-path:
      edge-tts-path:
    # 默认向量模型
    ai-model-embed:
      provider: QWEN
      model: text-embedding-v1
      apiKey: sk-??
      apiHost: https://dashscope.aliyuncs.com/api/v1/services/
      timeout: 60
  # AIRag向量库
  ai-rag:
    embed-store:
      host: 127.0.0.1
      port: 5432
      database: postgres
      user: postgres
      password: postgres
      table: embeddings
    # Brave Search 联网检索（AI Agent 工具）
    brave-search:
      api-key: ??
      endpoint: https://api.search.brave.com/res/v1/web/search
      count: 10
      timeout: 15
  # 平台上线安全配置
  firewall:
    # 数据源安全 (开启后，Online报表和图表的数据源为必填)
    dataSourceSafe: false
    # 低代码模式（dev:开发模式，prod:发布模式——关闭所有在线开发配置能力）
    lowCodeMode: dev
    # 登录是否启用验证码
    enableLoginCaptcha: true
    # 是否开启三级等保强密码校验（true 开启强密码模式，false 使用简单密码规则）
    enableStrongPwd: false
  # 签名密钥串(前后端要一致，正式发布请自行修改)
  signatureSecret: dd05f1c54d63749eda95f9fa6d49v442a
  #签名拦截接口
  signUrls: /sys/dict/getDictItems/*,/sys/dict/loadDict/*,/sys/dict/loadDictOrderByValue/*,/sys/dict/loadDictItem/*,/sys/dict/loadTreeData,/sys/api/queryTableDictItemsByCode,/sys/api/queryFilterTableDictInfo,/sys/api/queryTableDictByKeys,/sys/api/translateDictFromTable,/sys/api/translateDictFromTableByKeys,/sys/sendChangePwdSms,/sys/user/sendChangePhoneSms,/sys/sms,/desform/api/sendVerifyCode
  # 上传类型：local（本地存储）| minio（MinIO对象存储）| alioss（阿里云OSS）
  uploadType: local
  # 前端访问地址
  domainUrl:
    pc: http://localhost:3100
    app: http://localhost:8051
  path:
    #文件上传根目录 设置
    upload: /opt/upFiles
    #webapp文件路径
    webapp: /opt/webapp
  shiro:
    excludeUrls: /test/jeecgDemo/demo3,/test/jeecgDemo/redisDemo/**,/bigscreen/category/**,/bigscreen/visual/**,/bigscreen/map/**,/jmreport/bigscreen2/**
  #阿里云oss存储和大鱼短信秘钥配置
  oss:
    accessKey: ??
    secretKey: ??
    endpoint: oss-cn-beijing.aliyuncs.com
    bucketName: jeecgdev
    # 短信模板
    sms-template:
      # 签名
      signature:
      # 模板code
      templateCode:
        # 登录短信、忘记密码模板编码
        SMS_175435174:
        # 修改密码短信模板编码
        SMS_465391221:
        # 注册账号短信模板编码
        SMS_175430166:
  # 在线预览文件服务器地址配置
  file-view-domain: http://fileview.jeecg.com
  # minio文件上传
  minio:
    minio_url: http://minio.jeecg.com
    minio_name: ??
    minio_pass: ??
    bucketName: otatest
  #大屏报表参数设置
  jmreport:
    #多租户模式，默认值为空(created:按照创建人隔离、tenant:按照租户隔离)
    saasMode:
    # 签名密钥串(前后端要一致，正式发布请自行修改)
    signatureSecret: dd05f1c54d63749eda95f9fa6d49v442a
    ai:
      # OpenAI 兼容 base 地址（必填）
      base-url: https://api.deepseek.com
      # API Key（必填，留空则 AI 不可用）
      api-key:
      # 模型名
      model: deepseek-v4-pro
      #确定性输出，默认temperature=0
      temperature: 0
      # 单次生成最大 token 数(传给大模型的 max_tokens)，DeepSeek 合法范围[1,393216]
      max-tokens: 393216
      # AI自动建表功（安全警告: 此功能会直接操作数据库DDL/DML，生产环境请勿启用）
      autoTableEnabled: true
    # 平台上线安全配置
    firewall:
      # 数据源安全 (开启后，不允许使用平台数据源、SQL解析加签并且不允许查询数据库)
      dataSourceSafe: false
      # SQL解析安全 false: 数据库解析(默认,稳定性好) true: jsqlparser解析(不走数据库,安全级别高) v2.2.1+新增
      sqlParseSafe: true
      # 低代码开发模式（dev:开发模式，prod:发布模式—关闭在线报表设计功能，分配角色admin、lowdeveloper可放开限制）
      lowCodeMode: dev
      # sql注入检查级别（strict:严格, basic:简单校验, none:不校验）
      sqlInjectionLevel: basic
      # 数据源重试连接的次数，默认10，空或者0不限制次数(2.3.1+)
      numberOfRetries: 10
    # 高德地图Api配置
    gao-de-api:
      # 应用key
      api-key: ??
      # 应用秘钥
      secret-key: ??
  #xxl-job配置
  xxljob:
    enabled: false
    adminAddresses: http://127.0.0.1:9080/xxl-job-admin
    appname: ${spring.application.name}
    accessToken: ''
    address: 127.0.0.1:30007
    ip: 127.0.0.1
    port: 30007
    logPath: logs/jeecg/job/jobhandler/
    logRetentionDays: 30
  #分布式锁配置
  redisson:
    address: 127.0.0.1:6379
    password:
    type: STANDALONE
    enabled: true
  # 百度开放API配置
  baidu-api:
    app-id: ??
    api-key: ??
    secret-key: ??
#cas单点登录
